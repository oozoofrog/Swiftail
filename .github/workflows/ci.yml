# Build (zero warnings) and run unit tests. Go interop tests skip themselves when the tool paths are unavailable.
name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Swift 6.3 (Xcode 26) hangs while compiling test targets. Use Swift 6.4 (Xcode 27.2), the version used for development.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test --skip-build --skip SwiftailControlTests
      # Many control client tests measure deadlines of about 1 second. Deadlines fire late when tests run in parallel on a runner with few cores.
      - name: Test (control client, serial)
        run: swift test --skip-build --filter SwiftailControlTests --no-parallel
