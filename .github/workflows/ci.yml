# 빌드(경고 0)와 단위 시험. Go 상호 운용 시험은 도구 경로가 없으면 스스로 건너뛴다.
name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Swift 6.3(Xcode 26)은 시험 대상을 컴파일하다 멈춘다. 개발에 쓰는 Swift 6.4(Xcode 27.2)로 돌린다.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test --skip-build
